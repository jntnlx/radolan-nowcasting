# conda env create -f environment.yml && conda activate radar-ml
name: radar-ml
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - scipy
  - matplotlib
  - cartopy
  - wradlib=2.6       # RADOLAN binary reader
  - pysteps=1.19      # classical baselines (optical flow, STEPS)
  - opencv            # used by pysteps' Lucas-Kanade
  - dask              # parallel STEPS members
  - zarr>=3
  - pytest
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch>=2.9
